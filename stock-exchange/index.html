<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinWise Admin Dashboard</title>
    <!-- Complete Console & Error Suppression -->
    <script>
      (function() {
        var noop = function() {};
        var methods = [
          'log', 'debug', 'info', 'warn', 'error', 'table', 'trace',
          'dir', 'dirxml', 'group', 'groupCollapsed', 'groupEnd',
          'clear', 'count', 'countReset', 'assert', 'profile',
          'profileEnd', 'time', 'timeLog', 'timeEnd', 'timeStamp'
        ];
        if (typeof window !== 'undefined' && window.console) {
          for (var i = 0; i < methods.length; i++) {
            try {
              window.console[methods[i]] = noop;
            } catch (e) {}
          }
        }

        // Suppress uncaught exceptions from printing to console
        window.onerror = function() {
          return true;
        };

        // Suppress unhandled promise rejections
        window.onunhandledrejection = function(e) {
          if (e && e.preventDefault) e.preventDefault();
          return true;
        };

        window.addEventListener('error', function(e) {
          if (e && e.preventDefault) e.preventDefault();
          if (e && e.stopPropagation) e.stopPropagation();
          return true;
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.preventDefault) e.preventDefault();
          if (e && e.stopPropagation) e.stopPropagation();
          return true;
        }, true);

        window.__DEFINES__ = window.__DEFINES__ || {};
        window.process = window.process || { env: {} };
      })();
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased min-h-screen">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
